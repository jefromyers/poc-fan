services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      timeout: 3s
      retries: 10

  web:
    build: .
    ports:
      - "3009:3000"
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      MCP_API_TOKEN: ${MCP_API_TOKEN}
      MCP_MAX_PROMPTS: ${MCP_MAX_PROMPTS:-12}
      MCP_MAX_TOTAL_RUNS: ${MCP_MAX_TOTAL_RUNS:-72}
      MCP_JOB_CONCURRENCY: ${MCP_JOB_CONCURRENCY:-2}
      MCP_RESULT_READ_URL_LIMIT: ${MCP_RESULT_READ_URL_LIMIT:-500}
      MCP_STALE_JOB_MINUTES: ${MCP_STALE_JOB_MINUTES:-720}
    depends_on:
      db:
        condition: service_healthy

  # Redis is intentionally omitted for this POC (the single web process holds the
  # OpenAI stream and tees it straight to the browser). It would earn its place
  # only if multiple clients needed to watch the same run — then publish events
  # to a Redis channel and have the SSE route subscribe.

volumes:
  pgdata:
